spring.application.name=booking-system
server.port=8080

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Redis
spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# CORS
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4300}
app.frontend.url=${FRONTEND_URL}

# API version
spring.mvc.apiversion.use.path-segment=1

# JWT setting
security.jwt.token.secret-key=${JWT_SECRET}
security.jwt.issuer=booking-system

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RESEND Mail
resend.api.key=${RESEND_API}

# recaptcha
recaptcha.secret-key=${RECAPTCHA_SECRET}


