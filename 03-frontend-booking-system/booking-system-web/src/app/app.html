<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" routerLink="/welcome">
            <img class="logo" src="logo.png" alt="BookingSystem Logo">
        </a>

        <!-- Toggler button for mobile -->
        <button class="navbar-toggler" type="button" (click)="toggleNavbar()" [attr.aria-expanded]="isNavbarOpen()"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar links -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent" [class.show]="isNavbarOpen()">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                @if (!(authService.authStatus$| async)) {
                <li class="nav-item">
                    <a class="nav-link" routerLink="/login" (click)="closeNavbar()">Login</a>
                </li>
                }
                @if (authService.authStatus$| async) {
                <li class="nav-item">
                    <a class="nav-link" (click)="authService.logout(); closeNavbar()">Logout</a>
                </li>
                }
                @if (!(authService.authStatus$| async)) {
                <li class="nav-item">
                    <a class="nav-link" routerLink="/register" (click)="closeNavbar()">Register</a>
                </li>
                }
                <li class="nav-item">
                    <a class="nav-link" routerLink="/welcome" (click)="closeNavbar()">Welcome</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/roleSelect" (click)="closeNavbar()">Role Selection</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/authDebug" (click)="closeNavbar()">Debug-Auth</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
