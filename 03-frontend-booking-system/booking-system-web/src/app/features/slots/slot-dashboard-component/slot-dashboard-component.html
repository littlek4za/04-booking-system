<p>slot-dashboard-component works!</p>

<button type="button" (click)="openAddSlotWizard()">+ Create Slot</button>
<button type="button" [routerLink]="['/eventDashboard']">Back to DashBoard</button>


@if(slotWizard === true) {
<div class="modal-backdrop fade show"></div> <!-- disables background -->
<div class="pop-out-wizard">
    <app-add-slot-wizard [eventId]="eventId" [eventType]="eventType" (close)="closeAddSlotWizard()"></app-add-slot-wizard>
</div>
}

<table class="table table-striped table-dark">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Event</th>
            <th scope="col">Description</th>
            <th scope="col">Location Address</th>
            <th scope="col">Location Link</th>
            <th scope="col">Event Type</th>
            <th scope="col">Action</th>
            <th scope="col">Slot Available</th>
            <th scope="col">Last Updated</th>
        </tr>
    </thead>
</table>
